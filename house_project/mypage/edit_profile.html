<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>정보 수정 - 안전한 집 찾기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mypage.css') }}">
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">HOME</a>
        <a href="{{ url_for('main.find_property') }}">매물찾기</a>
    </div>
    
    <div class="nav-links">
        {% if session.get('user_id') %}
            <a href="{{ url_for('mypage.mypage') }}">My Page</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}">Login</a>
            <a href="{{ url_for('auth.register') }}">Register</a>
        {% endif %}
    </div>
</div>

<div class="container">
    <div class="profile-card">
        <form action="{{ url_for('mypage.update_profile') }}" method="post" enctype="multipart/form-data" style="display: flex; width: 100%; gap: 50px;">
            
            <div class="profile-left">
                <img id="preview" class="profile-img-preview" 
                     src="{{ url_for('static', filename='profile_pics/' + profile_img) if profile_img else url_for('static', filename='profile_pics/default.png') }}" 
                     alt="프로필 사진"
                     onerror="this.src='https://via.placeholder.com/150'">
                <div style="margin-top: 15px;">
                    <label for="profile_img" class="file-label">사진 변경</label>
                    <input type="file" id="profile_img" name="profile_img" accept="image/*" style="display: none;" onchange="previewImage(this)">
                </div>
            </div>

            <div class="profile-right" style="flex: 1;">
                <h2 style="margin-bottom: 30px;">내 정보 수정</h2>
                
                <div class="info-row">
                    <span class="info-label">닉네임</span>
                    <input type="text" name="nickname" value="{{ nickname }}" class="edit-input" placeholder="새 닉네임 입력" required>
                </div>
                
                <div class="info-row">
                    <span class="info-label">한 줄 소개</span>
                    <input type="text" name="bio" value="{{ bio }}" class="edit-input" placeholder="본인을 짧게 소개해 주세요">
                </div>

                <div class="pw-change-section">
                    <h3>비밀번호 변경 (선택)</h3>
                    <div class="info-row">
                        <input type="password" name="new_password" class="edit-input" placeholder="새 비밀번호">
                    </div>
                    <div class="info-row" style="border-bottom: none;">
                        <input type="password" name="confirm_password" class="edit-input" placeholder="새 비밀번호 확인">
                    </div>
                </div>

                <div class="btn-group" style="margin-top: 40px;">
                    <button type="submit" class="btn btn-edit">저장하기</button>
                    <a href="{{ url_for('mypage.mypage') }}" class="btn btn-logout">취소</a>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    // 이미지 미리보기 스크립트
    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

</body>
</html>
