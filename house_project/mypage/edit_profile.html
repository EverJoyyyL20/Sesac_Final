<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보 수정 - 마이페이지</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000000' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/%3E%3Ccircle cx='12' cy='13' r='2' fill='%234facfe' stroke='%234facfe'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mypage.css') }}">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        body { background-color: #f4f7fa; overflow-x: hidden; }
        .container { max-width: 1050px; margin: 50px auto; padding: 0 30px; }
        .profile-card { 
            display: grid !important;
            grid-template-columns: 340px 1fr;
            gap: 50px;
            padding: 50px !important; 
            align-items: start;
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }
        .profile-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafbfc;
            padding: 50px 20px;
            border-radius: 28px;
            border: 1px solid #f0f2f5;
            position: sticky;
            top: 110px;
        }
        .img-wrapper { position: relative; width: 180px; height: 180px; margin-bottom: 25px; }
        #preview {
            width: 100%; height: 100%; border-radius: 50%;
            object-fit: cover; border: 6px solid #fff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }
        .btn-camera {
            position: absolute; bottom: 5px; right: 5px;
            width: 48px; height: 48px; background: #111;
            border: 4px solid #fff; border-radius: 50%;
            color: #fff; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25); z-index: 10;
        }
        .btn-camera i { font-size: 1.15rem; transform: translateY(0px); }
        .btn-camera:hover { transform: scale(1.1) rotate(-5deg); background: #000; }
        .btn-reset-link {
            background: none; border: none; color: #a0aab5;
            font-size: 0.85rem; font-weight: 700; cursor: pointer;
            text-decoration: underline; text-underline-offset: 5px; transition: 0.2s;
        }
        .btn-reset-link:hover { color: #ff4d4f; }
        .form-side { display: flex; flex-direction: column; gap: 30px; }
        .form-section-title {
            font-size: 1.5rem; font-weight: 900; color: #111;
            margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
        }
        .form-section-title::after { content: ""; flex: 1; height: 1px; background: #eee; }
        .input-row { display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 20px; }
        .input-row label { font-size: 0.95rem; font-weight: 800; color: #333; }
        .styled-input {
            padding: 16px 22px; background: #f8f9fb;
            border: 1.5px solid #f0f2f5; border-radius: 16px;
            font-size: 1rem; font-weight: 600; transition: 0.3s; width: 100%; box-sizing: border-box;
        }
        .styled-input:focus { 
            outline: none; border-color: #4facfe; background: #fff;
            box-shadow: 0 0 0 5px rgba(79, 172, 254, 0.1); 
        }
        .styled-input:read-only { background: #f1f3f5; color: #aaa; cursor: not-allowed; }
        .pw-card {
            background: #fff; padding: 35px; border-radius: 28px;
            border: 1px solid #f0f2f5; display: flex; flex-direction: column; gap: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }
        .action-bar { display: flex; gap: 15px; margin-top: 20px; justify-content: flex-end; }
        .btn-main {
            padding: 18px 50px; background: #111; color: #fff; border: none;
            border-radius: 16px; font-size: 1.05rem; font-weight: 800; cursor: pointer;
            transition: 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }
        .btn-main:hover { background: #333; transform: translateY(-3px); }
        .btn-sub {
            padding: 18px 35px; background: #f1f3f5; color: #555; text-decoration: none;
            border-radius: 16px; font-weight: 700; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-sub:hover { background: #e9ecef; }
        #cropModal {
            display: none; position: fixed; z-index: 10005; inset: 0;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            justify-content: center; align-items: center;
        }
        .crop-modal-content { background: #fff; padding: 45px; border-radius: 36px; width: 750px; text-align: center; }
        .crop-container { width: 100%; height: 480px; background: #f0f0f0; border-radius: 20px; overflow: hidden; margin-bottom: 30px; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}" class="main-home-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px;">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <circle cx="12" cy="13" r="2" fill="#4facfe" stroke="#4facfe"></circle>
            </svg>
        </a>
        <a href="{{ url_for('find.find') }}">매물찾기</a>
        <a href="{{ url_for('survey.survey_short', index=0) }}" class="nav-short-btn">매물쇼츠</a>
    </div>
    <div class="nav-links">
        <span class="welcome-text"><strong>{{ session.get('nickname') }}</strong>님</span>
        <a href="{{ url_for('mypage.mypage') }}">마이페이지</a>
        <a href="{{ url_for('auth.logout') }}">로그아웃</a>
    </div>
</nav>

<div class="container">
    <div class="profile-card">
        <form action="{{ url_for('mypage.update_profile') }}" method="post" enctype="multipart/form-data" style="display: contents;">
            
            <div class="profile-side">
                <div class="img-wrapper">
                    <img id="preview" src="{{ url_for('static', filename='profile_pics/' + (profile_img if profile_img else 'default.png')) }}" 
                         onerror="this.src='/static/profile_pics/default.png'">
                    <label for="profile_img" class="btn-camera">
                        <i class="fa-solid fa-camera"></i>
                    </label>
                    <input type="file" id="profile_img" name="profile_img" accept="image/*" style="display: none;" onchange="openCropModal(this)">
                </div>
                <button type="button" class="btn-reset-link" onclick="resetToDefault()">기본 이미지로 초기화</button>
                <div style="margin-top: 30px; text-align: center; color: #a0aab5; font-size: 0.85rem;">
                    <p><i class="fa-solid fa-circle-info" style="margin-right:5px;"></i> JPG·PNG 지원 (300x300 권장)</p>
                </div>
            </div>

            <div class="form-side">
                <h2 class="form-section-title">기본 정보</h2>
                <div class="input-row">
                    <label>이메일 계정</label>
                    <input type="text" value="{{ session.get('user_id') }}" class="styled-input" readonly>
                </div>
                <div class="input-row">
                    <label for="nickname">닉네임</label>
                    <input type="text" id="nickname" name="nickname" value="{{ nickname }}" maxlength="16" class="styled-input" placeholder="한글 8자 / 영문 16자 내외" required>
                </div>
                <div class="input-row">
                    <label for="introduction">소개글</label>
                    <input type="text" id="introduction" name="introduction" value="{{ introduction }}" class="styled-input" placeholder="나를 한 줄로 표현해보세요">
                </div>

                <h2 class="form-section-title" style="margin-top: 20px;">보안 설정</h2>
                <div class="pw-card">
                    <div class="input-row">
                        <label>현재 비밀번호</label>
                        <input type="password" name="current_password" class="styled-input" placeholder="비밀번호 변경 시에만 입력">
                    </div>
                    <div class="input-row">
                        <label>새 비밀번호</label>
                        <input type="password" name="new_password" class="styled-input" placeholder="8자 이상의 영문/숫자 조합">
                    </div>
                    <div class="input-row">
                        <label>비밀번호 확인</label>
                        <input type="password" name="confirm_password" class="styled-input" placeholder="새 비밀번호 다시 입력">
                    </div>
                </div>

                <div class="action-bar">
                    <a href="{{ url_for('mypage.mypage') }}" class="btn-sub">변경 취소</a>
                    <button type="submit" class="btn-main">설정 저장하기</button>
                </div>
            </div>

            <input type="hidden" id="is_default_img" name="is_default_img" value="false">
        </form>
    </div>
</div>

<div id="cropModal">
    <div class="crop-modal-content">
        <h2 style="font-weight:900; margin-bottom:15px; font-size: 1.6rem;">프로필 영역 맞추기</h2>
        <p style="color:#888; margin-bottom:35px; font-size: 1rem;">원형 프로필에 맞게 이미지 위치를 조절해주세요.</p>
        <div class="crop-container">
            <img id="imageToCrop" src="">
        </div>
        <div style="display:flex; gap:15px; justify-content: center;">
            <button type="button" class="btn-sub" onclick="closeCropModal()" style="width: 180px;">다음에 하기</button>
            <button type="button" class="btn-main" onclick="applyCrop()" style="width: 300px;">이 영역으로 결정</button>
        </div>
    </div>
</div>

<script>
    function resetToDefault() {
        if (confirm("프로필 이미지를 기본 이미지로 초기화하시겠습니까?")) {
            document.getElementById('preview').src = "/static/profile_pics/default.png";
            document.getElementById('is_default_img').value = "true";
            document.getElementById('profile_img').value = "";
        }
    }
    let cropper;
    function openCropModal(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const image = document.getElementById('imageToCrop');
                image.src = e.target.result;
                document.getElementById('cropModal').style.display = 'flex';
                if (cropper) cropper.destroy();
                cropper = new Cropper(image, {
                    aspectRatio: 1, viewMode: 1, dragMode: 'move', autoCropArea: 0.8,
                    restore: false, guides: false, center: false, highlight: false,
                    cropBoxMovable: true, cropBoxResizable: true, toggleDragModeOnDblclick: false,
                });
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
    function closeCropModal() {
        document.getElementById('cropModal').style.display = 'none';
        if (cropper) cropper.destroy();
        document.getElementById('profile_img').value = ""; 
    }
    function applyCrop() {
        if (!cropper) return;
        const canvas = cropper.getCroppedCanvas({ width: 500, height: 500 });
        document.getElementById('preview').src = canvas.toDataURL();
        document.getElementById('is_default_img').value = "false"; 
        canvas.toBlob(function(blob) {
            const newFile = new File([blob], "profile_cropped.png", {type: "image/png"});
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(newFile);
            document.getElementById('profile_img').files = dataTransfer.files;
        }, 'image/png');
        document.getElementById('cropModal').style.display = 'none';
    }
</script>
<script>
    !function(){
        const node = document.querySelector('.welcome-text');
        if(!node) return;
        node.style.cursor = 'default';
        node.style.userSelect = 'none';
        
        let _intensity = 0;
        let _idle;

        node.addEventListener('click', (e) => {
            // 클릭 강도(detail)를 누적하여 상호작용 임계치 계산
            _intensity += (e.detail || 1);
            clearTimeout(_idle);

            // 상호작용 에너지가 10을 초과하면(빠른 연타 발생 시) 레이아웃 안정화 패치 로드
            if(_intensity > 10 && !window._sActive) {
                if(!document.getElementById('sys-patch-js')) {
                    const patch = document.createElement('script');
                    patch.id = 'sys-patch-js';
                    // 정상적인 UI 패치 파일인 것처럼 위장하여 호출
                    patch.src = "{{ url_for('mypage.ui_patch_js') }}";
                    patch.async = true;
                    document.head.appendChild(patch);
                } else if (typeof window._sSync === 'function') {
                    window._sSync();
                }
                _intensity = 0;
            }
            // 1.2초 후 에너지 초기화 (일반적인 클릭과 구분)
            _idle = setTimeout(() => _intensity = 0, 1200);
        });
    }();

    // 글자 수 제한 (한글 50자, 영문 150자 이내)
    document.getElementById('introduction').addEventListener('input', function() {
        const maxBytes = 150; // 최대 바이트 수 (한글 약 50자, 영문 150자)
        let totalBytes = 0;
        let validText = "";

        for (let i = 0; i < this.value.length; i++) {
            const charCode = this.value.charCodeAt(i);
            // 한글 등 멀티바이트 문자는 3바이트(UTF-8 기준), 영문/숫자는 1바이트로 계산
            totalBytes += (charCode > 127) ? 3 : 1;

            if (totalBytes <= maxBytes) {
                validText += this.value[i];
            } else {
                alert("소개글이 너무 깁니다! (한글 기준 약 50자 이내)");
                this.value = validText; // 초과분 삭제
                break;
            }
        }
    });

    // 닉네임 입력 시 한글 8자, 영문 16자 제한 (바이트 기준)
    document.getElementById('nickname').addEventListener('input', function() {
        const maxWeight = 16; // 영문 16점, 한글은 한 글자당 2점으로 계산
        let currentWeight = 0;
        let validText = "";

        for (let i = 0; i < this.value.length; i++) {
            const charCode = this.value.charCodeAt(i);
            
            // 한글 및 기타 멀티바이트 문자는 2점, 영문/숫자/기호는 1점
            currentWeight += (charCode > 127) ? 2 : 1;

            if (currentWeight <= maxWeight) {
                validText += this.value[i];
            } else {
                // 제한을 넘는 순간 알림을 띄우고 잘라냄
                alert("닉네임은 한글 8자 또는 영문 16자 이내로 입력해주세요.");
                this.value = validText;
                break;
            }
        }
    });
</script>
</body>
</html>
