<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 탈퇴 - 안전한 집 찾기</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000000' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/%3E%3Ccircle cx='12' cy='13' r='2' fill='%234facfe' stroke='%234facfe'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">메인페이지</a>
        <a href="{{ url_for('find.find') }}">매물찾기</a>
    </div>
    <div class="nav-links">
        {% if session.get('user_id') %}
            <span class="welcome-text"><strong>{{ session.get('nickname') }}</strong>님</span>
            <a href="{{ url_for('mypage.mypage') }}">마이페이지</a>
            <a href="{{ url_for('auth.logout') }}">로그아웃</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}">로그인</a>
            <a href="{{ url_for('auth.register') }}">회원가입</a>
        {% endif %}
    </div>
</div>

<div class="page-wrapper">
    <div class="delete-box">
        <h2>회원 탈퇴</h2>
        
        <p class="warning">
            탈퇴 시 모든 데이터가 즉시 삭제되며,<br>
            다시 로그인하거나 복구할 수 없습니다.
        </p>
        
        <form action="{{ url_for('mypage.delete_user') }}" method="POST">
            {% if not session.get('is_social') %}
            <div class="input-group">
                <label for="password">비밀번호 확인</label>
                <input type="password" id="password" name="password" placeholder="현재 비밀번호 입력" required>
            </div>
            {% endif %}
            
            <div class="policy-check-area">
                <label>
                    <input type="checkbox" name="confirm_check" value="agreed" required>
                    <span>위 주의사항을 확인했으며 탈퇴에 동의합니다.</span>
                </label>
            </div>

            <button type="submit" class="delete-btn">정말 탈퇴하겠습니다</button>
            
            <a href="{{ url_for('mypage.mypage') }}" class="back-link">취소하고 돌아가기</a>
        </form>
    </div>
</div>

</body>
</html>
