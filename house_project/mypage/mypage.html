<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 안전한 집 찾기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mypage.css') }}">
    <style>
        /* 버튼 그룹 내 탈퇴 버튼 스타일 보정 */
        .btn-withdraw {
            background-color: #ee7474;
            color: white;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-withdraw:hover {
            background-color: #ed5a5a;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">HOME</a>
        <a href="{{ url_for('main.find_property') }}">매물찾기</a>
    </div>
    
    <div class="nav-links">
        {% if session.get('user_id') %}
            <a href="{{ url_for('mypage.mypage') }}">My Page</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}">Login</a>
            <a href="{{ url_for('auth.register') }}">Register</a>
        {% endif %}
    </div>
</div>

<div class="container">
    <div class="profile-card">
        <div class="profile-left">
            <img class="profile-img-preview" 
                 src="{{ profile_img if profile_img else url_for('static', filename='profile_pics/default.png') }}" 
                 alt="프로필 사진" 
                 onerror="this.src='https://via.placeholder.com/150'">
        </div>

        <div class="profile-right">
            <div class="info-row">
                <span class="info-label">이메일 계정</span>
                <span class="info-value user-email-text">{{ user_email }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">닉네임</span>
                <span class="info-value">{{ nickname if nickname else '설정된 닉네임이 없습니다.' }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">한 줄 소개</span>
                <span class="info-value">{{ bio if bio else '소개글을 등록해 보세요.' }}</span>
            </div>
            
            <div class="btn-group">
                <a href="{{ url_for('mypage.edit_profile') }}" class="btn btn-edit">내 정보 수정</a>
                <a href="{{ url_for('mypage.delete_confirm') }}" class="btn btn-withdraw">회원 탈퇴</a>
            </div>
        </div>
    </div>

    <div class="content-section">
        <div class="content-box">
            <h3>📝 최근 설문 결과</h3>
            <p class="empty-text">진행한 설문 내역이 없습니다.</p>
        </div>
        <div class="content-box">
            <h3>⭐ 찜한 매물</h3>
            <p class="empty-text">저장된 매물이 없습니다.</p>
        </div>
    </div>
</div>

</body>
</html>
