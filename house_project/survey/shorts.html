<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>맞춤 추천 매물</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        .shorts-wrapper {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory; /* 세로 스냅 */
        }
        .prop-section {
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color: white;
            background-size: cover;
            background-position: center;
        }
        .info-overlay {
            padding: 40px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
        }
        .match-badge {
            background: #4facfe; color: #white;
            padding: 5px 12px; border-radius: 20px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="shorts-wrapper">
    {% for item in recommendations %}
    <section class="prop-section" style="background-image: url('{{ item.main_image }}');">
        <div class="info-overlay">
            <span class="match-badge">매칭점수 {{ item.match_score }}점</span>
            
            <h1 style="font-size: 2rem; margin: 15px 0 5px;">
                {{ item.rent_type }} {{ item.price_display }}
            </h1>
            
            <p style="opacity: 0.8;">📍 {{ item.address }}</p>
            
            {% if item.ai_comment %}
            <p style="font-size: 0.9rem; color: #4facfe; margin-top: 10px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 5px;">
                🤖 {{ item.ai_comment }}
            </p>
            {% endif %}

            <button onclick="location.href='/find?id={{item._id_str}}'" 
                    style="margin-top:20px; padding:10px 20px; border-radius:10px; border:none; background:white; font-weight:bold; cursor:pointer;">
                지도에서 위치 확인
            </button>
        </div>
    </section>
    {% endfor %}
</div>
</body>
</html>
