<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>맞춤형 매물 찾기 - 우리집</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">HOME</a>
        <a href="{{ url_for('main.find_property') }}">매물찾기</a>
    </div>

    <div class="nav-links">
        {% if session.get('user_id') %}
            <a href="{{ url_for('mypage.mypage') }}">My Page</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>

        {% else %}
            <a href="{{ url_for('auth.login') }}">Login</a>
            <a href="{{ url_for('auth.register') }}">Register</a>
        {% endif %}
    </div>
</div>

<div class="hero">
    <h1>당신에게 딱 맞는 집을 찾아보세요!</h1>
    <p>간단한 설문을 통해 선호하는 매물을 추천해 드립니다.</p>
    <button class="survey-btn" onclick="location.href='{{ url_for('main.survey') }}'">
        설문 시작하기
    </button>
</div>

<div class="footer">
    <div class="footer-links">
        <a href="#">이용약관</a> | <a href="#">개인정보처리방침</a> | <a href="#">고객센터</a>
    </div>
    <p>© 2026 SESAC. All rights reserved.</p>
</div>

</body>
</html>
