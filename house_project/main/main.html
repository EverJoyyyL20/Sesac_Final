<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>설문 및 매물 찾기</title>
    <style>
        body { font-family: 'Malgun Gothic', Arial, sans-serif; margin: 0; padding: 0; }
        /* 상단 바 스타일 */
        .navbar {
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
        }
        .navbar a { color: white; text-decoration: none; padding: 14px 20px; }
        .navbar .nav-links { display: flex; }
        .navbar a:hover { background-color: #555; color: #fff; }

        /* 메인 중앙 섹션 */
        .hero {
            text-align: center;
            padding: 150px 20px;
            background-color: #f8f9fa;
            height: 60vh;
        }
        .hero h1 { font-size: 2.8em; color: #222; margin-bottom: 10px; }
        .hero p { font-size: 1.2em; color: #666; margin-bottom: 30px; }
        
        .survey-btn {
            background-color: #5785e7;
            color: white;
            padding: 18px 40px;
            font-size: 1.3em;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }
        .survey-btn:hover { background-color: #4369c7; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">HOME</a>
        <a href="{{ url_for('main.find_property') }}">매물찾기</a>
    </div>
    <div class="nav-links">
        <a href="{{ url_for('mypage.mypage') }}">My Page</a>
        <a href="{{ url_for('auth.login') }}">Login</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
    </div>
</div>

<div class="hero">
    <h1>당신에게 딱 맞는 집을 찾아보세요!</h1>
    <p>주택임대차 보호법을 기반으로 안전한 매물을 추천해 드립니다.</p>
    <button class="survey-btn" onclick="location.href='{{ url_for('main.survey') }}'">
        설문 시작하기
    </button>
</div>

</body>
</html>
