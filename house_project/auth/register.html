<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 안전한 집 찾기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">Home</a>
        <a href="{{ url_for('find_property.find_property') }}">매물찾기</a>
    </div>
    
    <div class="nav-links">
        <a href="{{ url_for('auth.login') }}">Login</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
    </div>
</div>

<div class="page-wrapper">
    <div class="register-box">
        <h2>회원가입</h2>
        <p style="color: #666; margin-bottom: 25px;">서비스 이용을 위한 정보를 입력해주세요.</p>
        
        <form action="{{ url_for('auth.register') }}" method="post" onsubmit="return validateRegister()">
            <div class="input-group">
                <label for="email">이메일 주소</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="8자 이상 입력" required>
            </div>

            <div class="input-group">
                <label for="confirm_password">비밀번호 확인</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="비밀번호 다시 입력" required>
            </div>

            <div class="policy-container" style="text-align: left; margin: 20px 0;">
                <label class="policy-check" style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer;">
                    <input type="checkbox" name="policy_agree" required style="margin-top: 5px;">
                    <span style="font-size: 0.9rem; line-height: 1.4;">
                        (필수) <strong>개인정보 처리방침</strong>에 동의합니다.<br>
                        <small style="color: #999;">
                            * 수집항목: 이메일, 비밀번호<br>
                            * 목적: 서비스 제공 및 본인 식별
                        </small>
                    </span>
                </label>
            </div>

            <button type="submit" class="register-btn">회원가입 완료</button>
        </form>

        <div class="divider" style="margin: 25px 0; text-align: center; position: relative;">
            <hr style="border: 0; height: 1px; background: #eee;">
            <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #fff; padding: 0 10px; color: #ccc; font-size: 0.8rem;">또는</span>
        </div>

        <button type="button" class="google-btn" onclick="location.href='{{ url_for('auth.google_login') }}'" 
                style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-weight: bold;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_Logo.svg" alt="Google" style="width: 18px;">
            Google로 시작하기
        </button>

        <div class="login-link" style="margin-top: 30px; text-align: center; font-size: 0.9rem; color: #666;">
            이미 계정이 있으신가요? <a href="{{ url_for('auth.login') }}" style="color: #4facfe; text-decoration: none; font-weight: bold;">로그인</a>
        </div>
    </div>
</div>

<script>
    // 회원가입 유효성 검사
    function validateRegister() {
        const pw = document.getElementById('password').value;
        const pwConfirm = document.getElementById('confirm_password').value;
        
        // 1. 비밀번호 일치 확인
        if (pw !== pwConfirm) {
            alert("비밀번호가 서로 일치하지 않습니다.");
            return false;
        }

        // 2. 비밀번호 최소 길이 확인 (안전성 확보 조치)
        if (pw.length < 8) {
            alert("보안을 위해 비밀번호는 8자 이상으로 설정해주세요.");
            return false;
        }
        
        return true;
    }
</script>

</body>
</html>
