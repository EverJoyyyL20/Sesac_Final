<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - 안전한 집 찾기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<div class="page-wrapper">
    <div class="register-box">
        <h2>회원가입</h2>
        <p style="color: #666; margin-bottom: 20px;">이메일과 비밀번호만으로 간편하게 시작하세요!</p>
        
        <form action="{{ url_for('auth.register') }}" method="post" id="mainForm">
            <div class="input-group">
                <label>이메일 주소</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>
            <div class="input-group">
                <label>비밀번호</label>
                <input type="password" id="password" name="password" placeholder="8자 이상 입력" required>
            </div>
            <div class="input-group">
                <label>비밀번호 확인</label>
                <input type="password" id="confirm_password" placeholder="비밀번호 재입력" required>
            </div>
            
            <button type="submit" class="register-btn">가입 완료</button>
        </form>
        
        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('auth.login') }}" style="color: #4facfe; text-decoration: none;">이미 계정이 있으신가요? 로그인</a>
        </div>
    </div>
</div>

<script>
    // 폼 제출 전 간단한 비밀번호 일치 확인
    document.getElementById('mainForm').onsubmit = function(e) {
        const pw = document.getElementById('password').value;
        const pwConfirm = document.getElementById('confirm_password').value;
        
        if (pw !== pwConfirm) {
            alert("비밀번호가 일치하지 않습니다.");
            e.preventDefault();
            return false;
        }
    };
</script>
</body>
</html>
