<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - 안전한 집 찾기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">HOME</a>
        <a href="{{ url_for('main.find_property') }}">매물찾기</a>
    </div>
    <div class="nav-links">
        <a href="{{ url_for('mypage.mypage') }}">My Page</a>
        <a href="{{ url_for('auth.login') }}">Login</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
    </div>
</div>

<div class="page-wrapper">
    <div class="register-box">
        <h2>회원가입</h2>
        
        <form action="{{ url_for('auth.register') }}" method="post">
            <div class="input-group">
                <label for="email">이메일 주소</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>
            </div>

            <div class="input-group">
                <label for="confirm_password">비밀번호 확인</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="비밀번호 다시 입력" required>
            </div>

            <div class="policy-container">
                <label class="policy-check">
                    <input type="checkbox" name="policy_agree" required>
                    <span>
                        (필수) <strong>개인정보 처리방침</strong>에 동의합니다.<br>
                        <small style="color: #999;">
                            * 수집항목: 이메일, 비밀번호<br>
                            * 목적: 서비스 이용 및 본인 식별<br>
                            * 개인정보 보호법에 따라 안전하게 관리됩니다.
                        </small>
                    </span>
                </label>
            </div>

            <button type="submit" class="register-btn">가입하기</button>
        </form>

        <div class="login-link">
            이미 계정이 있으신가요? <a href="{{ url_for('auth.login') }}">로그인</a>
        </div>
    </div>
</div>

</body>
</html>
