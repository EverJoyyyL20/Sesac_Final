<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 설문 및 매물 찾기</title>
    <style>
        /* 기존 메인 페이지 스타일 유지 */
        body { font-family: 'Malgun Gothic', Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        
        .navbar {
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
        }
        .navbar a { color: white; text-decoration: none; padding: 14px 20px; }
        .navbar .nav-links { display: flex; }
        .navbar a:hover { background-color: #555; color: #fff; }

        /* 전체 화면 중앙 정렬을 위한 컨테이너 */
        .page-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 60px); /* 상단바 높이를 제외한 나머지 중앙 */
        }

        /* 중앙 네모난 로그인 상자 */
        .login-box {
            background-color: white;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .login-box h2 { margin-bottom: 30px; color: #333; }

        /* 입력창 스타일 */
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        /* 일반 로그인 버튼 */
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* 구분선 */
        .divider {
            margin: 25px 0;
            border-bottom: 1px solid #eee;
            position: relative;
        }
        .divider span {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 0 10px;
            color: #aaa;
            font-size: 12px;
        }

        /* 구글 OAuth 버튼 */
        .google-btn {
            width: 100%;
            padding: 12px;
            background-color: white;
            color: #757575;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .google-btn:hover { background-color: #f7f7f7; }
        .google-btn img { width: 18px; }

        /* 하단 회원가입 이동 링크 */
        .signup-link { margin-top: 25px; font-size: 14px; color: #666; }
        .signup-link a { color: #5785e7; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">HOME</a>
        <a href="{{ url_for('main.find_property') }}">매물찾기</a>
    </div>
    <div class="nav-links">
        <a href="{{ url_for('mypage.mypage') }}">My Page</a>
        <a href="{{ url_for('auth.login') }}">Login</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
    </div>
</div>

<div class="page-wrapper">
    <div class="login-box">
        <h2>로그인</h2>
        
        <form action="{{ url_for('auth.login') }}" method="post">
            <div class="input-group">
                <input type="email" name="email" placeholder="example@email.com" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="비밀번호" required>
            </div>
            <button type="submit" class="login-btn">로그인</button>
        </form>

        <div class="divider">
            <span>또는</span>
        </div>

        <button type="button" class="google-btn" onclick="location.href='/login/google'">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_Reference_Icon.svg" alt="Google Logo">
            Google로 시작하기
        </button>

        <div class="signup-link">
            아직 계정이 없으신가요? <a href="{{ url_for('auth.register') }}">회원가입</a>
        </div>
    </div>
</div>

</body>
</html>
