<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 안전한 집 찾기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">HOME</a>
        <a href="{{ url_for('main.find_property') }}">매물찾기</a>
    </div>
    <div class="nav-links">
        <a href="{{ url_for('mypage.mypage') }}">My Page</a>
        <a href="{{ url_for('auth.login') }}">Login</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
    </div>
</div>

<div class="page-wrapper">
    <div class="login-box">
        <h2>로그인</h2>
        
        <form action="{{ url_for('auth.login') }}" method="post">
            <div class="input-group">
                <input type="email" name="email" placeholder="이메일 주소 (example@email.com)" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="비밀번호" required>
            </div>
            <button type="submit" class="login-btn">로그인</button>
        </form>

        <div class="divider">
            <span>또는</span>
        </div>

        <button type="button" class="google-btn" onclick="location.href='/login/google'">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_Reference_Icon.svg" alt="Google Logo">
            Google로 시작하기
        </button>

        <div class="signup-link">
            아직 계정이 없으신가요? <a href="{{ url_for('auth.register') }}">회원가입</a>
        </div>
    </div>
</div>

</body>
</html>
