<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 안전한 집 찾기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        /* 🔥 [통일된 상단바 스타일 추가] */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 6%; 
            width: 100%;
            box-sizing: border-box;
            background-color: #222;
        }
        .navbar a {
            font-size: 1.25rem; 
            font-weight: 700;   
            text-decoration: none;
            color: #fff;        
            margin: 0 15px;     
            transition: color 0.3s;
        }
        .navbar a:hover { color: #007bff; }
        .welcome-text {
            font-size: 1.1rem;
            margin-right: 15px;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">메인페이지</a>
        <a href="{{ url_for('find.find') }}">매물찾기</a>
    </div>
    <div class="nav-links">
        <a href="{{ url_for('auth.login') }}">로그인</a>
        <a href="{{ url_for('auth.register') }}">회원가입</a>
    </div>
</div>

<div class="page-wrapper">
    <div class="login-box">
        <h2>로그인</h2>
        
        <form action="{{ url_for('auth.login') }}" method="post">
            <div class="input-group">
                <input type="email" name="email" placeholder="이메일 주소 (example@email.com)" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="비밀번호" required>
            </div>
            <button type="submit" class="login-btn">로그인</button>
        </form>

        <div class="divider">
            <span>또는</span>
        </div>

        <button type="button" class="google-btn" onclick="location.href='/login/google'">
              <img src="{{ url_for('static', filename='image/google.svg') }}" alt="Google Logo">
              <span>Google로 시작하기</span>
        </button>

        <div class="signup-link">
            아직 계정이 없으신가요? <a href="{{ url_for('auth.register') }}">회원가입</a>
        </div>
    </div>
</div>

</body>
</html>
