<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - HomeMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}" class="main-home-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px;">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <circle cx="12" cy="13" r="2" fill="#4facfe" stroke="#4facfe"></circle>
            </svg>
        </a>
        <a href="{{ url_for('find.find') }}">매물찾기</a>
        <a href="{{ url_for('survey.survey_short', index=0) }}" class="nav-short-btn">매물쇼츠</a>
    </div>
    <div class="nav-links">
    {% if session.get('user_id') %}
        <span class="welcome-text">
            
            {% set profile_img = session.get('profile_img_name', 'default.png') %}
            {% if profile_img.startswith('http') %}
                <img src="{{ profile_img }}"
                    class="nav-profile-img" alt="프로필">
            {% else %}
                <img src="{{ url_for('static', filename='profile_pics/' + profile_img) }}"
                    class="nav-profile-img" alt="프로필">
            {% endif %}
            
            <strong>{{ session.get('nickname') }}</strong>님
        </span>
        <a href="{{ url_for('mypage.mypage') }}">마이페이지</a>
        <a href="{{ url_for('auth.logout') }}">로그아웃</a>
    {% else %}
        <a href="{{ url_for('auth.login') }}">로그인</a>
        <a href="{{ url_for('auth.register') }}">회원가입</a>
    {% endif %}
    </div>
</div>

<div class="page-wrapper">
    <div class="login-box">
        <h2>로그인</h2>
        
        <form action="{{ url_for('auth.login') }}" method="post">
            <div class="input-group">
                <input type="email" name="email" placeholder="이메일 주소 (example@email.com)" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="비밀번호" required>
            </div>
            <button type="submit" class="login-btn">로그인</button>
        </form>

        <div class="divider">
            <span>또는</span>
        </div>
        <button type="button" class="google-btn" onclick="location.href='/login/google'">
              <img src="{{ url_for('static', filename='image/google.svg') }}" alt="Google Logo">
              <span>Google로 시작하기</span>
        </button>
        <button type="button" class="naver-btn" onclick="location.href='/login/naver'">
            <img src="{{ url_for('static', filename='image/naver.png') }}" alt="네이버 로그인">
        </button>
        <button type="button" class="kakao-btn" onclick="location.href='/login/kakao'">
            <img src="{{ url_for('static', filename='image/kakao.png') }}" alt="카카오 로그인">
        </button> 
        <div class="signup-link">
            아직 계정이 없으신가요? <a href="{{ url_for('auth.register') }}">회원가입</a>
        </div>
    </div>
</div>
</body>
</html>
