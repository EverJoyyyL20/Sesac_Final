<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>서울 부동산 매물 탐색</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/find_property.css') }}">
    
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId={{ client_id }}&submodules=geocoder"></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">메인페이지</a>
        <a href="{{ url_for('find.find') }}">매물찾기</a>
    </div>
    <div class="nav-links">
        {% if session.get('user_id') %}
            <span class="welcome-text"><strong>{{ session.get('nickname') }}</strong>님</span>
            <a href="{{ url_for('mypage.mypage') }}">마이페이지</a>
            <a href="{{ url_for('auth.logout') }}">로그아웃</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}">로그인</a>
            <a href="{{ url_for('auth.register') }}">회원가입</a>
        {% endif %}
    </div>
</div>

<div id="map-container">
    <div class="status-header"><span id="status-text">매물을 불러오는 중...</span></div>

    <div class="search-box">
        <button id="toggle-btn" onclick="toggleFilter()"><</button>
        
        <div class="search-header">
            <strong>🔍 매물 상세 필터</strong>
        </div>
        
        <div class="f-section">
            <label>📍 주소로 검색 (반경 설정)</label>
            <div class="f-row" style="flex-direction: column; gap: 5px;">
                <input type="text" id="search-address" placeholder="주소를 선택하려면 클릭하세요" readonly onclick="execDaumPostcode()" style="width: 100%; cursor: pointer; background-color: #f9f9f9;">
                <div class="f-row">
                    <select id="search-radius" onchange="updateMarkers()">
                        <option value="500">500m 이내</option>
                        <option value="1000" selected>1km 이내</option>
                        <option value="2000">2km 이내</option>
                    </select>
                    <button onclick="execDaumPostcode()" class="iw-btn" style="width: 60px;">검색</button>
                </div>
                <button id="reset-search" onclick="resetSearchCenter()" style="display:none; font-size: 11px; margin-top:5px; background:none; border:none; color:#666; text-decoration:underline; cursor:pointer;">📍 반경 검색 해제</button>
            </div>
        </div>

        <div id="filter-content">
            <div class="f-section">
                <label>거래/건물 용도</label>
                <div class="f-row">
                    <select id="filter-type" onchange="handleTypeChange()">
                        <option value="">전체 거래</option>
                        <option value="월세">월세</option>
                        <option value="전세">전세</option>
                    </select>
                    <select id="filter-use" onchange="updateMarkers()">
                        <option value="">전체 용도</option>
                        <option value="원룸">원룸</option>
                        <option value="투룸">투룸</option>
                        <option value="오피스텔">오피스텔</option>
                    </select>
                </div>
            </div>

            <div class="f-section">
                <label>보증금 (만원)</label>
                <div class="f-row">
                    <input type="number" id="min-deposit" placeholder="최소" min="0" oninput="validateNonNegative(this); updateMarkers()">
                    <span>~</span>
                    <input type="number" id="max-deposit" placeholder="최대" min="0" oninput="validateNonNegative(this); updateMarkers()">
                </div>
            </div>

            <div class="f-section" id="monthly-price-section">
                <label>월세 (만원)</label>
                <div class="f-row">
                    <input type="number" id="min-price" placeholder="최소" min="0" oninput="validateNonNegative(this); updateMarkers()">
                    <span>~</span>
                    <input type="number" id="max-price" placeholder="최대" min="0" oninput="validateNonNegative(this); updateMarkers()">
                </div>
            </div>

            <div class="f-section">
                <label>면적 (㎡)</label>
                <div class="f-row">
                    <input type="number" id="min-size" placeholder="최소" min="0" oninput="validateNonNegative(this); updateMarkers()">
                    <span>~</span>
                    <input type="number" id="max-size" placeholder="최대" min="0" oninput="validateNonNegative(this); updateMarkers()">
                </div>
            </div>

            <div class="f-section">
                <div class="f-check-row">
                    <label><input type="checkbox" id="filter-parking" onchange="updateMarkers()"> 주차 가능만</label>
                    <label><input type="checkbox" id="exclude-under" onchange="updateMarkers()"> 반지하 제외</label>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>
</div>

<div id="propertyModal" class="modal">
    <div class="modal-content">
        <h2 style="margin:0 0 20px 0; font-size: 20px;">🏠 매물 상세 정보</h2>
        
        <div class="detail-slider-container" id="detailSlider">
            <div class="detail-slider-wrapper" id="sliderWrapper">
                <div class="detail-page" id="infoPage">
                    <div id="modal-body-content"></div>
                </div>
                <div class="detail-page" id="chartPage">
                    <h3 style="text-align:center; font-size: 16px; margin-bottom: 15px;">📊 매물 입지 분석</h3>
                    <div style="height: 250px; width: 100%;">
                        <canvas id="radarChart"></canvas>
                    </div>
                    <p style="text-align:center; color:#999; font-size:12px; margin-top:10px;">← 옆으로 밀어서 정보 보기</p>
                </div>
            </div>
        </div>

        <div class="slider-dots">
            <span class="dot active" onclick="goToPage(0)"></span>
            <span class="dot" onclick="goToPage(1)"></span>
        </div>

        <div class="modal-footer-btns">
            <button id="favoriteBtn" class="fav-btn" onclick="handleFavorite()">❤️ 찜하기</button>
            <button id="closeModalBtn" class="close-btn" onclick="closeModal()">닫기</button>
        </div>
    </div>
</div>

<script>
    let map, markers = [], lastRequestId = 0, currentOpenIw = null;
    let searchCenter = null, centerMarker = null;
    let myRadarChart = null;

    window.onload = function() {
        map = new naver.maps.Map('map', { 
            center: new naver.maps.LatLng(37.5665, 126.9780), 
            zoom: 12, 
            minZoom: 11 
        });

        naver.maps.Event.addListener(map, 'idle', updateMarkers);
        naver.maps.Event.addListener(map, 'click', () => { 
            if(currentOpenIw){currentOpenIw.close(); currentOpenIw=null;} 
        });

        // 초기 필터 설정 (URL 파라미터 기반)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('type')) {
            document.getElementById('filter-type').value = urlParams.get('type');
            handleTypeChange();
        }
        if (urlParams.has('max_deposit')) document.getElementById('max-deposit').value = urlParams.get('max_deposit');
        if (urlParams.has('max_price')) document.getElementById('max-price').value = urlParams.get('max_price');

        const targetId = urlParams.get('id');
        if (targetId) moveToSpecificProperty(targetId);
        else updateMarkers();
    };

    let searchCircle = null; // 원 객체를 담을 전역 변수 추가

    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                const addr = data.address;
                document.getElementById("search-address").value = addr;
                
                naver.maps.Service.geocode({ query: addr }, function(status, response) {
                    if (status !== naver.maps.Service.Status.OK) return alert('좌표 변환 실패');
                    const result = response.v2.addresses[0];
                    const lat = parseFloat(result.y);
                    const lng = parseFloat(result.x);
                    const radius = parseInt(document.getElementById('search-radius').value); // 설정된 반경값

                    searchCenter = { lat, lng };
                    const centerPos = new naver.maps.LatLng(lat, lng);

                    // 1. 기존 마커 및 원 제거
                    if (centerMarker) centerMarker.setMap(null);
                    if (searchCircle) searchCircle.setMap(null);

                    // 2. 중심점 마커 생성
                    centerMarker = new naver.maps.Marker({
                        position: centerPos,
                        map: map,
                        icon: {
                            content: '<div style="width:16px; height:16px; background:red; border:2px solid white; border-radius:50%; box-shadow:0 0 8px rgba(0,0,0,0.5);"></div>',
                            anchor: new naver.maps.Point(8, 8)
                        }
                    });

                    // 3. 반경 원 그리기
                    searchCircle = new naver.maps.Circle({
                        map: map,
                        center: centerPos,
                        radius: radius, // 미터(m) 단위
                        fillColor: '#4facfe',
                        fillOpacity: 0.2,
                        strokeColor: '#4facfe',
                        strokeOpacity: 0.5,
                        strokeWeight: 2
                    });

                    document.getElementById('reset-search').style.display = 'block';
                    map.setCenter(centerPos);
                    
                    // 반경에 따른 적절한 줌 레벨 설정
                    const zoomLevel = radius <= 500 ? 16 : (radius <= 1000 ? 15 : 14);
                    map.setZoom(zoomLevel);
                    
                    updateMarkers();
                });
            }
        }).open();
    }

    // 반경 Select 박스 변경 시 원 크기도 함께 업데이트
    document.getElementById('search-radius').onchange = function() {
        if (searchCenter && searchCircle) {
            const newRadius = parseInt(this.value);
            searchCircle.setRadius(newRadius);
            updateMarkers();
        }
    };

    function resetSearchCenter() {
        searchCenter = null;
        if (centerMarker) centerMarker.setMap(null);
        if (searchCircle) searchCircle.setMap(null); // 원 제거
        document.getElementById('search-address').value = "";
        document.getElementById('reset-search').style.display = 'none';
        updateMarkers();
    }

    function updateMarkers() {
        const zoom = map.getZoom();
        const bounds = map.getBounds();
        const requestId = ++lastRequestId;

        const filters = {
            type: document.getElementById('filter-type').value,
            bUse: document.getElementById('filter-use').value,
            minDep: document.getElementById('min-deposit').value,
            maxDep: document.getElementById('max-deposit').value,
            minPri: document.getElementById('min-price').value,
            maxPri: document.getElementById('max-price').value,
            minSize: document.getElementById('min-size').value,
            maxSize: document.getElementById('max-size').value,
            parking: document.getElementById('filter-parking').checked ? "주차 가능" : "",
            excludeUnder: document.getElementById('exclude-under').checked ? "true" : "false",
            radius: document.getElementById('search-radius').value
        };

        let apiUrl = zoom < 14 ? '/api/stats/gu' : `/api/properties?sw_lat=${bounds.getSW().lat()}&sw_lng=${bounds.getSW().lng()}&ne_lat=${bounds.getNE().lat()}&ne_lng=${bounds.getNE().lng()}`;

        if (zoom >= 14) {
            apiUrl += `&type=${filters.type}&building_use=${filters.bUse}&min_deposit=${filters.minDep}&max_deposit=${filters.maxDep}`;
            apiUrl += `&min_price=${filters.minPri}&max_price=${filters.maxPri}&min_size=${filters.minSize}&max_size=${filters.maxSize}`;
            apiUrl += `&parking=${filters.parking}&exclude_under=${filters.excludeUnder}`;
            if (searchCenter) {
                apiUrl += `&center_lat=${searchCenter.lat}&center_lng=${searchCenter.lng}&radius=${filters.radius}`;
            }
        }

        fetch(apiUrl).then(res => res.json()).then(data => {
            if (requestId !== lastRequestId) return;
            
            // 1. 기존 마커 무조건 싹 지우기
            markers.forEach(m => m.setMap(null));
            markers = [];

            if (zoom < 14) { 
                renderGu(data); 
                document.getElementById('status-text').innerText = "서울 지역별 매물 현황";
            } else { 
                // 2. [핵심] 서버에서 받은 데이터 중 '현재 화면 안에 있는 것'만 골라내기
                const currentBounds = map.getBounds();
                const visibleData = data.filter(item => {
                    const position = new naver.maps.LatLng(item.location.coordinates[1], item.location.coordinates[0]);
                    return currentBounds.hasLatLng(position); // 화면 좌표 안에 있는지 체크
                });

                // 3. 화면 안에 있는 것만 마커로 그리기
                renderProperties(visibleData); 
                
                document.getElementById('status-text').innerText = visibleData.length > 0 ? 
                    `📍 현재 화면 매물 ${visibleData.length}건 (반경 내)` : "😥 화면 내 조건에 맞는 매물이 없어요";
            }
        });
    }

    // --- 마커 렌더링 함수 ---
    function renderGu(stats) {
        stats.forEach(gu => {
            const marker = new naver.maps.Marker({
                position: new naver.maps.LatLng(gu.lat, gu.lng),
                map: map,
                icon: { content: `<div class="gu-tag">${gu._id}</div>`, anchor: new naver.maps.Point(40, 20) }
            });
            naver.maps.Event.addListener(marker, 'click', () => map.morph(marker.getPosition(), 15));
            markers.push(marker);
        });
    }

    function renderProperties(data) {
        const groups = {};
        data.forEach(item => {
            const key = `${item.location.coordinates[1]},${item.location.coordinates[0]}`;
            if (!groups[key]) groups[key] = [];
            groups[key].push(item);
        });

        Object.entries(groups).forEach(([key, items]) => {
            const first = items[0];
            const markerPos = new naver.maps.LatLng(first.location.coordinates[1], first.location.coordinates[0]);
            const priceLabel = first.rent_type === '월세' ? `${first.deposit}/${first.price}` : (first.deposit || first.price);

            const marker = new naver.maps.Marker({
                position: markerPos,
                map: map,
                icon: { content: `<div class="price-tag">${items.length > 1 ? '매물 ' + items.length : priceLabel}</div>`, anchor: new naver.maps.Point(30, 15) }
            });

            let html = `<div class="iw-container">`;
            items.forEach(item => {
                html += `<div class="iw-item"><div class="iw-title">${formatPrice(item)}</div><button class="iw-btn" onclick="openDetail('${item._id}')">상세정보 보기</button></div>`;
            });
            html += `</div>`;

            const iw = new naver.maps.InfoWindow({ content: html, borderWidth: 0, backgroundColor: "transparent", disableAnchor: true });
            naver.maps.Event.addListener(marker, 'click', () => {
                if (currentOpenIw === iw) { iw.close(); currentOpenIw = null; } 
                else { if (currentOpenIw) currentOpenIw.close(); iw.open(map, marker); currentOpenIw = iw; }
            });
            markers.push(marker);
        });
    }

    // --- 모달 및 상세 정보 로직 ---
    function openDetail(id) {
        fetch(`/api/property/${id}`).then(res => res.json()).then(prop => {
            window.currentSelectedProp = prop;
            goToPage(0); // 모달 오픈 시 첫 페이지

            const favBtn = document.getElementById('favoriteBtn');
            favBtn.innerText = prop.is_favorite ? '💔 찜 취소' : '❤️ 찜하기';
            
            let floorClass = prop.floor.includes("반지하") ? "floor-tag floor-danger" : (prop.floor.includes("옥탑") ? "floor-tag floor-warn" : "floor-tag");

            let imgHtml = '';
            if (prop.images && prop.images.length > 0) {
                imgHtml += `<div class="image-slider-wrapper">`;
                if (prop.images.length > 1) imgHtml += `<button class="slider-btn prev-btn" onclick="scrollSlider(-1)">&#10094;</button>`;
                imgHtml += `<div class="modal-img-container" id="modalImgContainer">`;
                prop.images.forEach(url => {
                    let finalUrl = url.includes('?') ? url + '&w=800' : url + '?w=800';
                    imgHtml += `<img src="${finalUrl}" class="prop-img" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/280x200?text=No+Image'">`;
                });
                imgHtml += `</div>`; 
                if (prop.images.length > 1) imgHtml += `<button class="slider-btn next-btn" onclick="scrollSlider(1)">&#10095;</button>`;
                imgHtml += `</div>`;
            } else {
                imgHtml = `<div class="no-img-placeholder">이미지가 없는 매물입니다.</div>`;
            }

            document.getElementById('modal-body-content').innerHTML = `
                ${imgHtml}
                <div class="detail-row"><span>📍 주소</span><b>${prop.address}</b></div>
                <div class="detail-row"><span>💰 가격</span><b style="color:#2ecc71; font-size:1.1em;">${formatPrice(prop)}</b></div>
                <div class="detail-row"><span>🏢 층수</span><span class="${floorClass}">${prop.floor}</span></div>
                <div class="detail-row"><span>📐 면적</span><b>${prop.area ?? '정보없음'} ㎡</b></div>
                <div class="detail-row"><span>🏠 건물유형</span><b>${prop.buildtype ?? '정보없음'}</b></div>
                <div class="detail-row"><span>🚗 주차</span><b>${prop.parking ? '가능' : '불가'}</b></div>
            `;
            if (prop.score) drawRadarChart(prop.score);
            document.getElementById('propertyModal').style.display = 'block';
        });
    }

    function goToPage(index) {
        const wrapper = document.getElementById('sliderWrapper');
        const dots = document.querySelectorAll('.dot');
        wrapper.style.transform = `translateX(-${index * 50}%)`;
        dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
    }

    function drawRadarChart(score) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        if (myRadarChart) myRadarChart.destroy();
        const s = score || {};
        const scoreData = [(s.traffic||0)*100, (s.convenience||0)*100, (s.green||0)*100, (s.play||0)*100, (s.health||0)*100, (s.living||0)*100, (s.safety||0)*100];
        myRadarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['교통', '편의', '자연', '놀이', '건강', '생활', '안전'],
                datasets: [{ data: scoreData, backgroundColor: 'rgba(79, 172, 254, 0.3)', borderColor: '#4facfe', borderWidth: 2 }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { r: { min: 0, max: 100, ticks: { display: false } } }, plugins: { legend: { display: false } } }
        });
    }

    function handleFavorite() {
        const prop = window.currentSelectedProp;
        fetch('/api/favorite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ property_id: prop._id, address: prop.address, price_info: formatPrice(prop) })
        }).then(res => res.json()).then(data => {
            if (data.status === 'success') document.getElementById('favoriteBtn').innerText = data.action === 'added' ? '💔 찜 취소' : '❤️ 찜하기';
            else alert(data.message);
        });
    }

    function formatPrice(item) {
        if (item.rent_type === '월세') return `월세 ${item.deposit}/${item.price}`;
        return `${item.rent_type} ${item.deposit || item.price}`;
    }

    function closeModal() { document.getElementById('propertyModal').style.display = 'none'; }
    function validateNonNegative(input) { if (input.value < 0) input.value = 0; }
    function handleTypeChange() {
        const type = document.getElementById('filter-type').value;
        document.getElementById('monthly-price-section').style.display = (type === "전세") ? "none" : "block";
        updateMarkers();
    }
    function toggleFilter() {
        const searchBox = document.querySelector('.search-box');
        const btn = document.getElementById('toggle-btn');
        searchBox.classList.toggle('closed');
        btn.innerText = searchBox.classList.contains('closed') ? ">" : "<";
    }
    function scrollSlider(direction) {
        const container = document.getElementById('modalImgContainer');
        if (container) container.scrollBy({ left: direction * 290, behavior: 'smooth' });
    }
    function moveToSpecificProperty(id) {
        fetch(`/api/property/${id}`).then(res => res.json()).then(prop => {
            if (prop && prop.location) {
                const pos = new naver.maps.LatLng(prop.location.coordinates[1], prop.location.coordinates[0]);
                map.setCenter(pos);
                map.setZoom(17);
                setTimeout(() => openDetail(id), 500);
            }
        });
    }

    document.getElementById('closeModalBtn').onclick = closeModal;
</script>
</body>
</html>
