<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 부동산 매물 탐색 - 안전한 집 찾기</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/find_property.css') }}">
    
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId={{ client_id }}"></script>
    
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">Home</a>
        <a href="{{ url_for('find_property.find_property') }}" class="active">매물찾기</a>
    </div>
    <div class="nav-links">
        {% if session.get('user_id') %}
            <span class="welcome-text"><strong>{{ session.get('nickname') }}</strong>님</span>
            <a href="{{ url_for('mypage.mypage') }}">My Page</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}">Login</a>
            <a href="{{ url_for('auth.register') }}">Register</a>
        {% endif %}
    </div>
</div>

<div id="map-container">
    <div class="status-header">
        <span id="status-text">📍 매물 지도를 불러오는 중...</span>
    </div>
    <div id="map"></div>
</div>

<script>
    let map;
    let markers = [];

    window.onload = function() {
        const seoulBounds = new naver.maps.LatLngBounds(
            new naver.maps.LatLng(37.42, 126.75), 
            new naver.maps.LatLng(37.70, 127.20)
        );

        map = new naver.maps.Map('map', {
            center: new naver.maps.LatLng(37.5665, 126.9780),
            zoom: 12,
            minZoom: 11,
            maxBounds: seoulBounds
        });

        naver.maps.Event.addListener(map, 'idle', updateMarkers);
    };

    function updateMarkers() {
        const zoom = map.getZoom();
        const bounds = map.getBounds();
        const sw = bounds.getSW();
        const ne = bounds.getNE();

        markers.forEach(m => m.setMap(null));
        markers = [];

        if (zoom < 14) {
            document.getElementById('status-text').innerText = "💡 지도를 확대하면 상세 매물이 보입니다.";
            fetch('/api/stats/gu')
                .then(res => res.json())
                .then(stats => {
                    stats.forEach(gu => {
                        const marker = new naver.maps.Marker({
                            position: new naver.maps.LatLng(gu.lat, gu.lng),
                            map: map,
                            icon: {
                                content: `<div class="gu-tag">${gu._id}</div>`,
                                anchor: new naver.maps.Point(40, 20)
                            }
                        });
                        naver.maps.Event.addListener(marker, 'click', () => {
                            map.morph(marker.getPosition(), 15);
                        });
                        markers.push(marker);
                    });
                });
        } else {
            const url = `/api/properties?sw_lat=${sw.lat()}&sw_lng=${sw.lng()}&ne_lat=${ne.lat()}&ne_lng=${ne.lng()}`;
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('status-text').innerText = `📍 현재 영역 매물 ${data.length.toLocaleString()}개`;

                    // 1. 좌표별 그룹화
                    const groups = {};
                    data.forEach(item => {
                        const coordKey = `${item.location.coordinates[1]},${item.location.coordinates[0]}`;
                        if (!groups[coordKey]) groups[coordKey] = [];
                        groups[coordKey].push(item);
                    });

                    // 2. 그룹별 마커 및 인포윈도우 생성
                    Object.values(groups).forEach(items => {
                        const firstItem = items[0];
                        const count = items.length;
                        const markerLabel = count > 1 ? `매물 ${count}개` : firstItem.price;

                        const marker = new naver.maps.Marker({
                            position: new naver.maps.LatLng(firstItem.location.coordinates[1], firstItem.location.coordinates[0]),
                            map: map,
                            icon: {
                                content: `<div class="price-tag" style="${count > 1 ? 'background:#ff9f43;' : ''}">${markerLabel}</div>`,
                                anchor: new naver.maps.Point(20, 10)
                            }
                        });

                        // 인포윈도우 HTML 생성
                        let listHtml = `<div class="info-window-container" style="padding:15px; min-width:230px; max-height:350px; overflow-y:auto;">
                                        <h4 style="margin:0 0 10px 0; border-bottom:2px solid #4facfe; padding-bottom:5px;">🏠 매물 목록 (${count})</h4>`;
                        
                        items.forEach(item => {
                            const safeAddr = (item.address || '').replace(/'/g, "\\'");
                            const safeType = (item.rent_type || '').replace(/'/g, "\\'");
                            const safeFloor = (item.floor || '').replace(/'/g, "\\'");
                            const safeParking = (item.hasParking || '').replace(/'/g, "\\'");
                            const optionsJson = JSON.stringify(item.options || []).replace(/'/g, "\\'");

                            listHtml += `
                                <div class="info-item" style="margin-bottom:12px; font-size:13px; border-bottom:1px solid #eee; padding-bottom:8px;">
                                    <div style="font-weight:bold; color:#333;">[${item.rent_type}] <span style="color:#e74c3c;">${item.price}</span></div>
                                    <div style="color:#666; font-size:11px; margin-top:2px;">📍 ${item.address}</div>
                                    <div style="color:#888; font-size:11px;">🏢 ${item.floor} | 🚗 ${item.hasParking}</div>
                                    <button onclick="showPropertyDetail('${item._id}', '${safeType}', '${safeAddr}', '${item.deposit}', '${safeFloor}', '${safeParking}', '${optionsJson}')" 
                                            style="margin-top:5px; background:#4facfe; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px; width:100%;">
                                        상세보기
                                    </button>
                                </div>`;
                        });
                        listHtml += `</div>`;

                        const infoWindow = new naver.maps.InfoWindow({
                            content: listHtml,
                            backgroundColor: "#fff",
                            borderWidth: 0,
                            disableAnchor: false
                        });

                        naver.maps.Event.addListener(marker, 'click', () => {
                            if (infoWindow.getMap()) infoWindow.close();
                            else infoWindow.open(map, marker);
                        });
                        markers.push(marker);
                    });
                });
        }
    }

    function showPropertyDetail(id, type, addr, deposit, floor, parking, optionsJson) {
        const options = JSON.parse(optionsJson.replace(/\\'/g, "'"));
        const detailContent = `
[매물 상세 정보]
--------------------------
구분: ${type}
보증금: ${deposit}
층수: ${floor}
주차: ${parking}
주소: ${addr}

[포함 옵션]
${options.length > 0 ? options.join(', ') : '없음'}
--------------------------`;
        alert(detailContent);
    }
</script>
</body>
</html>
