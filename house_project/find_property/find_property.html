<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 부동산 매물 탐색</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/find_property.css') }}">
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId={{ client_id }}"></script>
    <style>
        /* 페이지 특화 레이아웃 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        #map-container { flex: 1; position: relative; width: 100%; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">Home</a>
        <a href="{{ url_for('find_property.find_property') }}">매물찾기</a>
    </div>

    <div class="nav-links">
        {% if session.get('user_id') %}
            <span class="welcome-text"><strong>{{ session.get('nickname') }}</strong>님</span>
            <a href="{{ url_for('mypage.mypage') }}">My Page</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}">Login</a>
            <a href="{{ url_for('auth.register') }}">Register</a>
        {% endif %}
    </div>
</div>

<div id="map-container">
    <div class="status-header"><span id="status-text">지도 로딩 중...</span></div>
    <div id="map"></div>
</div>

<div id="propertyModal" class="modal">
    <div class="modal-content">
        <h2 style="margin:0 0 20px 0; font-size: 20px;">🏠 매물 상세 정보</h2>
        <div id="modal-body"></div>
        <div style="margin-top:25px; display:flex; gap:12px;">
            <button id="favoriteBtn" class="fav-btn" onclick="handleFavorite()">❤️ 찜하기</button>
            <button onclick="closeModal()" style="flex:1; padding:14px; background:#eee; border:none; border-radius:12px; cursor:pointer;">닫기</button>
        </div>
    </div>
</div>

<script>
    let map;
    let markers = [];
    let infoWindows = [];
    let lastRequestId = 0;
    let allProperties = [];
    let openInfoWindowId = null;
    let myFavorites = JSON.parse(localStorage.getItem('property_favs') || '[]');

    // 드래그 감지용 변수
    let startX, startY;
    const DRAG_THRESHOLD = 5;

    window.onload = function() {
        map = new naver.maps.Map('map', {
            center: new naver.maps.LatLng(37.5665, 126.9780),
            zoom: 12,
            minZoom: 11
        });

        const mapDiv = document.getElementById('map');
        
        // [UX] 드래그와 클릭 구분 로직
        mapDiv.addEventListener('mousedown', e => { startX = e.pageX; startY = e.pageY; });
        mapDiv.addEventListener('mouseup', e => {
            const diffX = Math.abs(e.pageX - startX);
            const diffY = Math.abs(e.pageY - startY);
            
            // 드래그하지 않고 제자리 클릭했을 때만 정보창 닫기 시도
            if (diffX < DRAG_THRESHOLD && diffY < DRAG_THRESHOLD) {
                setTimeout(() => {
                    if (!e.target.closest('.price-tag') && !e.target.closest('.iw-container') && !e.target.closest('.gu-tag')) {
                        closeAllInfoWindows();
                    }
                }, 10);
            }
        });

        naver.maps.Event.addListener(map, 'idle', updateMarkers);
        updateMarkers();
    };

    /**
     * 가격 포맷팅 (전세: 억 단위, 월세: 월세/보증금 분리)
     */
    function formatPrice(item) {
        const rentType = item.rent_type;
        // 숫자로 변환 (값이 없을 경우 0)
        const priceVal = parseInt(String(item.price || "0").replace(/,/g, ''));
        const depositVal = parseInt(String(item.deposit || "0").replace(/,/g, ''));

        // 만원 단위를 "억/천"으로 변환하는 내부 보조 함수
        function toKoreanUnit(num) {
            if (num === 0) return "0";
            const uk = Math.floor(num / 10000);
            const remain = num % 10000;
            if (uk > 0) {
                return remain > 0 ? `${uk}억 ${remain.toLocaleString()}` : `${uk}억`;
            }
            return num.toLocaleString();
        }

        // 1. 월세인 경우: "월세 25 / 보증금 1,000"
        if (rentType === '월세') {
            return `월세 ${priceVal.toLocaleString()} / 보증금 ${toKoreanUnit(depositVal)}`;
        }

        // 2. 전세인 경우: "1억 9,300" (이미 앞에 '전세'가 붙으므로 숫자만 반환)
        if (rentType === '전세') {
            const total = depositVal || priceVal; // 전세는 보통 deposit에 큰 금액이 들어옴
            return toKoreanUnit(total);
        }

        return priceVal.toLocaleString();
    }

    /**
     * 층수 포맷팅 (1/3 -> 전체 3층 중 1층, 반지하/옥탑 대응)
     */
    function formatFloor(floorStr) {
        if (!floorStr) return "정보 없음";
        if (typeof floorStr === 'string' && floorStr.includes('/')) {
            const parts = floorStr.split('/');
            return `전체 ${parts[1].trim()}층 중 ${parts[0].trim()}층`;
        }
        return isNaN(floorStr) ? floorStr : `${floorStr}층`;
    }

    function closeAllInfoWindows() {
        infoWindows.forEach(iw => iw.close());
        openInfoWindowId = null;
    }

    function updateMarkers() {
        const zoom = map.getZoom();
        const bounds = map.getBounds();
        const requestId = ++lastRequestId;

        let apiUrl = zoom < 14 ? '/api/stats/gu' : 
            `/api/properties?sw_lat=${bounds.getSW().lat()}&sw_lng=${bounds.getSW().lng()}&ne_lat=${bounds.getNE().lat()}&ne_lng=${bounds.getNE().lng()}`;

        fetch(apiUrl)
            .then(res => res.json())
            .then(data => {
                if (requestId !== lastRequestId) return;
                markers.forEach(m => m.setMap(null));
                markers = [];

                if (zoom < 14) {
                    renderGu(data);
                    closeAllInfoWindows();
                } else {
                    allProperties = data;
                    renderProperties(data);
                }
            });
    }

    /**
     * 구 단위 마커 렌더링 (클릭 시 부드러운 morph 확대)
     */
    function renderGu(stats) {
        document.getElementById('status-text').innerText = "💡 지도를 확대하면 상세 매물이 보입니다.";
        stats.forEach(gu => {
            const marker = new naver.maps.Marker({
                position: new naver.maps.LatLng(gu.lat, gu.lng),
                map: map,
                icon: { content: `<div class="gu-tag">${gu._id}</div>`, anchor: new naver.maps.Point(40, 20) }
            });

            naver.maps.Event.addListener(marker, 'click', () => {
                // [UX] 중앙 이동과 줌을 동시에 부드럽게
                map.morph(marker.getPosition(), 15);
            });
            markers.push(marker);
        });
    }

    /**
     * 개별 매물 마커 렌더링
     */
    function renderProperties(data) {
        document.getElementById('status-text').innerText = `📍 현재 영역 매물 ${data.length.toLocaleString()}개`;
        
        const groups = {};
        data.forEach(item => {
            const key = `${item.location.coordinates[1]},${item.location.coordinates[0]}`;
            if (!groups[key]) groups[key] = [];
            groups[key].push(item);
        });

        const newInfoWindows = [];
        Object.entries(groups).forEach(([key, items]) => {
            const first = items[0];
            const markerPos = new naver.maps.LatLng(first.location.coordinates[1], first.location.coordinates[0]);
            
            // 마커 표시 가격 (월세면 "월세/보증금" 짧게)
            const shortPrice = first.rent_type === '월세' ? `${first.price}/${first.deposit}` : (first.price || first.deposit);

            const marker = new naver.maps.Marker({
                position: markerPos,
                map: map,
                icon: { content: `<div class="price-tag">${items.length > 1 ? '매물 ' + items.length : shortPrice}</div>`, anchor: new naver.maps.Point(30, 15) },
                zIndex: 200
            });

            let html = `<div class="iw-container">`;
            items.forEach(item => {
                html += `
                    <div class="iw-item">
                        <div class="iw-title" style="font-size: 14px;">${item.rent_type} ${formatPrice(item)}</div>
                        <div style="font-size:12px; color:#666; margin-bottom:8px;">🏢 ${formatFloor(item.floor)}</div>
                        <button class="iw-btn" onclick="openDetail('${item._id}')">상세정보 보기</button>
                    </div>`;
            });
            html += `</div>`;

            const iw = new naver.maps.InfoWindow({
                content: html, borderWidth: 0, backgroundColor: "transparent", disableAnchor: true
            });

            if (openInfoWindowId === key) iw.open(map, marker);

            naver.maps.Event.addListener(marker, 'click', () => {
                if (iw.getMap()) {
                    iw.close();
                    openInfoWindowId = null;
                } else {
                    closeAllInfoWindows();
                    iw.open(map, marker);
                    openInfoWindowId = key;
                    map.panTo(markerPos);
                }
            });

            markers.push(marker);
            newInfoWindows.push(iw);
        });
        infoWindows = newInfoWindows;
    }

    /**
     * 상세 모달창 열기
     */
    function openDetail(id) {
        const prop = allProperties.find(p => p._id === id);
        if (!prop) return;
        window.currentSelectedProp = prop;

        const isFav = myFavorites.includes(id);
        const favBtn = document.getElementById('favoriteBtn');
        favBtn.innerHTML = isFav ? '💔 찜 취소하기' : '❤️ 찜하기';
        favBtn.className = isFav ? 'fav-btn fav-inactive' : 'fav-btn fav-active';

        document.getElementById('modal-body').innerHTML = `
            <div class="detail-row"><span>주소</span><b>${prop.address}</b></div>
            <div class="detail-row"><span>가격</span><b style="color:#e74c3c">${formatPrice(prop)}</b></div>
            <div class="detail-row"><span>층수</span><b>${formatFloor(prop.floor)}</b></div>
            <div class="detail-row"><span>종류</span><b>${prop.rent_type}</b></div>
        `;
        document.getElementById('propertyModal').style.display = 'block';
    }

    function handleFavorite() {
        const prop = window.currentSelectedProp;
        if (!prop) return;
        const index = myFavorites.indexOf(prop._id);
        if (index === -1) {
            myFavorites.push(prop._id);
            alert("찜 목록에 추가되었습니다!");
        } else {
            myFavorites.splice(index, 1);
            alert("찜이 취소되었습니다.");
        }
        localStorage.setItem('property_favs', JSON.stringify(myFavorites));
        openDetail(prop._id);
    }

    function closeModal() { document.getElementById('propertyModal').style.display = 'none'; }
    window.onclick = function(e) { if (e.target.className === 'modal') closeModal(); }
</script>
</body>
</html>
