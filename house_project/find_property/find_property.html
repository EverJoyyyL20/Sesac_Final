<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>서울 부동산 매물 탐색</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/find_property.css') }}">
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId={{ client_id }}"></script>
    <style>
        /* 🔥 [통일된 상단바 스타일 추가] */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 6%; /* 좌우 여백 5% */
            width: 100%;
            box-sizing: border-box;
            background-color: #222; /* 검정색 배경 */
        }
        .navbar a {
            font-size: 1.25rem; 
            font-weight: 700;   
            text-decoration: none;
            color: #fff;        /* 흰색 글씨 */
            margin: 0 15px;     
            transition: color 0.3s;
        }
        .navbar a:hover { color: #007bff; }
        .welcome-text {
            font-size: 1.1rem;
            margin-right: 15px;
            color: #fff; /* 흰색 글씨 */
        }


/* 왼쪽 버튼 위치 */
.prev-btn {
    left: 10px;
}
/* 오른쪽 버튼 위치 */
.next-btn {
    right: 10px;
}
    .no-img-placeholder {
        width: 100%;
        height: 150px;
        background-color: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        color: #888;
        font-size: 0.9em;
        margin-bottom: 15px;
    }
/* 매물 상세 모달 텍스트 간격 개선 */
.detail-row {
    display: flex;
    align-items: center;
    gap: 8px;            /* 아이콘과 텍스트 간격 */
    margin-bottom: 10px; /* 줄 간격 */
    font-size: 15px;
}

.detail-row span {
    min-width: 70px;     /* 왼쪽 라벨 정렬 */
    color: #666;
}

.detail-row b {
    font-weight: 600;
}


        /* --- 기존 스타일 유지 --- */
        .image-slider-wrapper { position: relative; width: 100%; margin-bottom: 15px; }
        .modal-img-container {
            display: flex; gap: 10px; padding-bottom: 5px; overflow-x: scroll;
            scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth; scroll-snap-type: x mandatory;
        }
        .modal-img-container::-webkit-scrollbar { display: none; }
        .prop-img {
            width: 280px; height: 200px; object-fit: cover; border-radius: 8px; flex-shrink: 0;
            scroll-snap-align: center; background-color: #f0f0f0;
        }
        .slider-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5); color: white; border: none; border-radius: 50%;
            width: 40px; height: 40px; font-size: 20px; cursor: pointer; z-index: 10;
            display: flex; align-items: center; justify-content: center; transition: background-color 0.3s;
        }
        .slider-btn:hover { background-color: rgba(0, 0, 0, 0.8); }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }
        .no-img-placeholder {
            width: 100%; height: 150px; background-color: #eee;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; color: #888; font-size: 0.9em; margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index') }}">메인페이지</a>
        <a href="{{ url_for('find.find') }}">매물찾기</a>
    </div>
    <div class="nav-links">
        {% if session.get('user_id') %}
            <span class="welcome-text"><strong>{{ session.get('nickname') }}</strong>님</span>
            <a href="{{ url_for('mypage.mypage') }}">마이페이지</a>
            <a href="{{ url_for('auth.logout') }}">로그아웃</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}">로그인</a>
            <a href="{{ url_for('auth.register') }}">회원가입</a>
        {% endif %}
    </div>
</div>

<div id="map-container">
    <div class="status-header"><span id="status-text">매물을 불러오는 중...</span></div>

    <div class="search-box">
    <button id="toggle-btn" onclick="toggleFilter()"><</button>
    
    <div class="search-header">
        <strong>🔍 매물 상세 필터</strong>
        </div>
    
    <div id="filter-content">
        <div class="f-section">
            <label>거래/건물 용도</label>
            <div class="f-row">
                <select id="filter-type" onchange="handleTypeChange()">
                    <option value="">전체 거래</option>
                    <option value="월세">월세</option>
                    <option value="전세">전세</option>
                </select>
                <select id="filter-use" onchange="updateMarkers()">
                    <option value="">전체 용도</option>
                    <option value="원룸">원룸</option>
                    <option value="투룸">투룸</option>
                    <option value="오피스텔">오피스텔</option>
                </select>
                </div>
            </div>

            <div class="f-section">
                <label>보증금 (만원)</label>
                <div class="f-row">
                    <input type="number" id="min-deposit" placeholder="최소" min="0" oninput="validateNonNegative(this); updateMarkers()">
                    <span>~</span>
                    <input type="number" id="max-deposit" placeholder="최대" min="0" oninput="validateNonNegative(this); updateMarkers()">
                </div>
            </div>

            <div class="f-section" id="monthly-price-section">
                <label>월세 (만원)</label>
                <div class="f-row">
                    <input type="number" id="min-price" placeholder="최소" min="0" oninput="validateNonNegative(this); updateMarkers()">
                    <span>~</span>
                    <input type="number" id="max-price" placeholder="최대" min="0" oninput="validateNonNegative(this); updateMarkers()">
                </div>
            </div>

            <div class="f-section">
                <label>면적 (㎡)</label>
                <div class="f-row">
                    <input type="number" id="min-size" placeholder="최소" min="0" oninput="validateNonNegative(this); updateMarkers()">
                    <span>~</span>
                    <input type="number" id="max-size" placeholder="최대" min="0" oninput="validateNonNegative(this); updateMarkers()">
                </div>
            </div>

            <div class="f-section">
                <div class="f-check-row">
                    <label><input type="checkbox" id="filter-parking" onchange="updateMarkers()"> 주차 가능만</label>
                    <label><input type="checkbox" id="exclude-under" onchange="updateMarkers()"> 반지하 제외</label>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>
</div>

<div id="propertyModal" class="modal">
    <div class="modal-content">
        <h2 style="margin:0 0 20px 0; font-size: 20px;">🏠 매물 상세 정보</h2>
        <div id="modal-body"></div>
        <div style="margin-top:25px; display:flex; gap:12px;">
            <button id="favoriteBtn" class="fav-btn" onclick="handleFavorite()" style="flex:1; padding:14px; background:#fff; border:1px solid #ddd; border-radius:12px; cursor:pointer; font-weight:bold;">❤️ 찜하기</button>
            <button id="closeModalBtn" onclick="closeModal()" style="flex:1; padding:14px; background:#eee; border:none; border-radius:12px; cursor:pointer;">닫기</button>
        </div>
    </div>
</div>

<script>
    let map, markers = [], lastRequestId = 0, currentOpenIw = null;

    window.onload = function() {
        map = new naver.maps.Map('map', { 
            center: new naver.maps.LatLng(37.5665, 126.9780), 
            zoom: 12, 
            minZoom: 11 
        });

        naver.maps.Event.addListener(map, 'idle', updateMarkers);
        naver.maps.Event.addListener(map, 'click', () => { 
            if(currentOpenIw){currentOpenIw.close(); currentOpenIw=null;} 
        });

        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.has('type')) {
            const typeSelect = document.getElementById('filter-type');
            if (typeSelect) {
                typeSelect.value = urlParams.get('type');
                if (typeof handleTypeChange === "function") handleTypeChange();
            }
        }

        if (urlParams.has('max_deposit')) {
            const maxDepInput = document.getElementById('max-deposit');
            if (maxDepInput) maxDepInput.value = urlParams.get('max_deposit');
        }

        if (urlParams.has('max_price')) {
            const maxPriceInput = document.getElementById('max-price');
            if (maxPriceInput) maxPriceInput.value = urlParams.get('max_price');
        }

        const targetId = urlParams.get('id');
        if (targetId) {
            moveToSpecificProperty(targetId);
        } else {
            if (typeof updateMarkers === "function") updateMarkers();
        }
    };

    function scrollSlider(direction) {
        const container = document.getElementById('modalImgContainer');
        if (!container) return;
        const scrollAmount = 290; 
        container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }
    function validateNonNegative(input) {
        if (input.value < 0) { input.value = 0; }
    }

    function handleTypeChange() {
        const type = document.getElementById('filter-type').value;
        const monthlySection = document.getElementById('monthly-price-section');
        if (type === "전세") {
            monthlySection.style.display = "none";
            document.getElementById('min-price').value = ""; 
            document.getElementById('max-price').value = "";
        } else {
            monthlySection.style.display = "block";
        }
        updateMarkers(); 
    }

    function toggleFilter() {
        const searchBox = document.querySelector('.search-box');
        const btn = document.getElementById('toggle-btn');
        searchBox.classList.toggle('closed');
        if (searchBox.classList.contains('closed')) { btn.innerText = ">"; } else { btn.innerText = "<"; }
    }

    function updateMarkers() {
        const zoom = map.getZoom();
        const bounds = map.getBounds();
        const requestId = ++lastRequestId;

        const type = document.getElementById('filter-type').value;
        const bUse = document.getElementById('filter-use').value;
        const minDep = document.getElementById('min-deposit').value;
        const maxDep = document.getElementById('max-deposit').value;
        const minPri = document.getElementById('min-price').value;
        const maxPri = document.getElementById('max-price').value;
        const minSize = document.getElementById('min-size').value;
        const maxSize = document.getElementById('max-size').value;
        const parking = document.getElementById('filter-parking').checked ? "주차 가능" : "";
        const excludeUnder = document.getElementById('exclude-under').checked ? "true" : "false";

        let apiUrl = zoom < 14 ? '/api/stats/gu' : `/api/properties?sw_lat=${bounds.getSW().lat()}&sw_lng=${bounds.getSW().lng()}&ne_lat=${bounds.getNE().lat()}&ne_lng=${bounds.getNE().lng()}`;

        if (zoom >= 14) {
            apiUrl += `&type=${type}&building_use=${bUse}&min_deposit=${minDep}&max_deposit=${maxDep}`;
            apiUrl += `&min_price=${minPri}&max_price=${maxPri}&min_size=${minSize}&max_size=${maxSize}`;
            apiUrl += `&parking=${parking}&exclude_under=${excludeUnder}`;
        }

        fetch(apiUrl).then(res => res.json()).then(data => {
            if (requestId !== lastRequestId) return;
            markers.forEach(m => m.setMap(null));
            markers = [];

            if (zoom < 14) { 
                renderGu(data); 
                document.getElementById('status-text').innerText = "서울 지역별 매물 현황";
            } 
            else { 
                renderProperties(data); 
                const count = data.length;
                document.getElementById('status-text').innerText = count > 0 ? `📍 주변 매물 ${count}건` : "😥 조건에 맞는 매물이 없어요";
            }
        });
    }

    function renderGu(stats) {
        stats.forEach(gu => {
            const marker = new naver.maps.Marker({
                position: new naver.maps.LatLng(gu.lat, gu.lng),
                map: map,
                icon: { content: `<div class="gu-tag">${gu._id}</div>`, anchor: new naver.maps.Point(40, 20) }
            });
            naver.maps.Event.addListener(marker, 'click', () => map.morph(marker.getPosition(), 15));
            markers.push(marker);
        });
    }

    function renderProperties(data) {
        const groups = {};
        data.forEach(item => {
            const key = `${item.location.coordinates[1]},${item.location.coordinates[0]}`;
            if (!groups[key]) groups[key] = [];
            groups[key].push(item);
        });

        Object.entries(groups).forEach(([key, items]) => {
            const first = items[0];
            const markerPos = new naver.maps.LatLng(first.location.coordinates[1], first.location.coordinates[0]);
            const priceLabel = first.rent_type === '월세' ? `${first.deposit}/${first.price}` : (first.deposit || first.price);

            const marker = new naver.maps.Marker({
                position: markerPos,
                map: map,
                icon: { content: `<div class="price-tag">${items.length > 1 ? '매물 ' + items.length : priceLabel}</div>`, anchor: new naver.maps.Point(30, 15) }
            });

            let html = `<div class="iw-container">`;
            items.forEach(item => {
                html += `<div class="iw-item"><div class="iw-title">${formatPrice(item)}</div><button class="iw-btn" onclick="openDetail('${item._id}')">상세정보 보기</button></div>`;
            });
            html += `</div>`;

            const iw = new naver.maps.InfoWindow({ content: html, borderWidth: 0, backgroundColor: "transparent", disableAnchor: true });
            naver.maps.Event.addListener(marker, 'click', () => {
                if (currentOpenIw === iw) { iw.close(); currentOpenIw = null; } 
                else { if (currentOpenIw) currentOpenIw.close(); iw.open(map, marker); currentOpenIw = iw; }
            });
            markers.push(marker);
        });
    }

function openDetail(id) {
    fetch(`/api/property/${id}`)
        .then(res => res.json())
        .then(prop => {
            window.currentSelectedProp = prop;
            
            const favBtn = document.getElementById('favoriteBtn');
            favBtn.innerText = prop.is_favorite ? '💔 찜 취소' : '❤️ 찜하기';
            
            let floorClass = "floor-tag";
            if(prop.floor.includes("반지하")) floorClass += " floor-danger";
            else if(prop.floor.includes("옥탑")) floorClass += " floor-warn";

            let parkingText = "정보없음";
            if (prop.parking) {
                if (prop.parking.includes("가능")) parkingText = "가능";
                else parkingText = "불가";
            }
            let imgHtml = '';
            if (Array.isArray(prop.images) && prop.images.length > 0) {
                imgHtml += `<div class="image-slider-wrapper">`;
                if (prop.images.length > 1) {
                    imgHtml += `<button class="slider-btn prev-btn" onclick="scrollSlider(-1)">&#10094;</button>`;
                }
                imgHtml += `<div class="modal-img-container" id="modalImgContainer">`;
                prop.images.forEach(url => {
                    if (url && url.trim() !== "") {
                        let finalUrl = url.includes('?') ? url + '&w=800' : url + '?w=800';
                        imgHtml += `<img src="${finalUrl}" class="prop-img" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/280x200?text=No+Image'">`;
                    }
                });
                imgHtml += `</div>`; 
                if (prop.images.length > 1) {
                    imgHtml += `<button class="slider-btn next-btn" onclick="scrollSlider(1)">&#10095;</button>`;
                }
                imgHtml += `</div>`; 
            } else {
                imgHtml = `<div class="no-img-placeholder">이미지가 없는 매물입니다.</div>`;
            }

            document.getElementById('modal-body').innerHTML = `
                ${imgHtml}
                <div class="detail-row"><span>📍 주소</span><b>${prop.address}</b></div>
                <div class="detail-row"><span>💰 가격</span><b style="color:#2ecc71; font-size:1.1em;">${formatPrice(prop)}</b></div>
                <div class="detail-row"><span>🏢 층수</span><span class="${floorClass}">${prop.floor}</span></div>
                <div class="detail-row"><span>📐 면적</span><b>${prop.area ?? '정보없음'} ㎡</b></div>
                <div class="detail-row"><span>🏠 건물유형</span><b>${prop.buildtype ?? '정보없음'}</b></div>
                <div class="detail-row"><span>🚗 주차</span><b>${prop.parking ? '가능' : '불가'}</b></div>
            `;
            document.getElementById('propertyModal').style.display = 'block';
        })
        .catch(err => { /* 에러 처리 */ });
}

    function handleFavorite() {
        const prop = window.currentSelectedProp;
        fetch('/api/favorite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ property_id: prop._id, address: prop.address, price_info: formatPrice(prop) })
        })
        .then(res => res.json()).then(data => {
            if (data.status === 'success') {
                document.getElementById('favoriteBtn').innerText = data.action === 'added' ? '💔 찜 취소' : '❤️ 찜하기';
            } else { alert(data.message); }
        });
    }

    function formatPrice(item) {
        if (item.rent_type === '월세') return `월세 ${item.deposit}/${item.price}`;
        return `${item.rent_type} ${item.deposit || item.price}`;
    }

    function closeModal() { document.getElementById('propertyModal').style.display = 'none'; }
    function moveToSpecificProperty(id) {
        fetch(`/api/property/${id}`).then(res => res.json()).then(prop => {
            if (prop && prop.location) {
                const pos = new naver.maps.LatLng(prop.location.coordinates[1], prop.location.coordinates[0]);
                map.setCenter(pos);
                map.setZoom(17);
                setTimeout(() => openDetail(id), 500);
            }
        });
    }

    document.getElementById('closeModalBtn').onclick = closeModal;
</script>
</body>
</html>
